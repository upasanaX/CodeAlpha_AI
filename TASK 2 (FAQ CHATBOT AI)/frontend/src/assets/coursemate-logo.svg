<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="logoCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="logoWings" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="aiBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Filters -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Container -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="70" height="70" rx="18" fill="url(#logoBg)" stroke="#334155" stroke-width="2" />
    
    <!-- Graduation Cap Top -->
    <polygon points="35,16 56,26 35,36 14,26" fill="url(#logoCap)" filter="url(#logoGlow)" />
    <!-- Cap Neck Arc -->
    <path d="M 22 30 L 22 40 C 22 45, 48 45, 48 40 L 48 30" fill="none" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round" />
    <!-- Tassel -->
    <path d="M 35,26 L 53,35 L 53,46" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="53" cy="48" r="2.5" fill="#38BDF8" />

    <!-- Open Book / Wings -->
    <path d="M 35 48 C 26 45, 17 48, 12 55 C 20 60, 30 56, 35 52 Z" fill="url(#logoWings)" />
    <path d="M 35 48 C 44 45, 53 48, 58 55 C 50 60, 40 56, 35 52 Z" fill="url(#logoCap)" />
    <line x1="35" y1="46" x2="35" y2="57" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

    <!-- Central Spark -->
    <circle cx="35" cy="42" r="2.5" fill="#FFFFFF" filter="url(#logoGlow)" />
  </g>

  <!-- Brand Typography: Coursemate -->
  <text x="96" y="47" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    Course<tspan fill="#818CF8">mate</tspan>
  </text>

  <!-- AI Capsule Pill Badge -->
  <g transform="translate(272, 26)">
    <rect x="0" y="0" width="48" height="26" rx="8" fill="url(#aiBadgeGrad)" stroke="#818CF8" stroke-width="1.2" />
    <text x="24" y="18" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      AI
    </text>
  </g>

  <!-- Subtitle -->
  <text x="98" y="67" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="2.2">
    SMART LEARNING ASSISTANT
  </text>
</svg>
