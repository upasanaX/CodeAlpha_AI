<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56" fill="none">
  <defs>
    <!-- Background Glassmorphic Jewel -->
    <linearGradient id="lf_tile_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1238" />
      <stop offset="50%" stop-color="#140C28" />
      <stop offset="100%" stop-color="#0A0618" />
    </linearGradient>

    <!-- Iridescent Border -->
    <linearGradient id="lf_border_glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.8" />
    </linearGradient>

    <!-- Continuous L-to-F Flow Ribbon Gradient -->
    <linearGradient id="lf_ribbon_grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="30%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- F Crossbar Accent Gradient (Vibrant Energy) -->
    <linearGradient id="lf_crossbar_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>

    <!-- 3D Shadow for the Ribbon -->
    <filter id="lf_ribbon_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#818CF8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle -->
  <rect x="1.5" y="1.5" width="53" height="53" rx="16" 
        fill="url(#lf_tile_bg)" 
        stroke="url(#lf_border_glow)" 
        stroke-width="1.8" />

  <!-- Ambient Internal Light Orb -->
  <circle cx="20" cy="20" r="16" fill="#7C3AED" opacity="0.25" filter="blur(8px)" />
  <circle cx="36" cy="36" r="14" fill="#0284C7" opacity="0.2" filter="blur(8px)" />

  <!-- THE CREATIVE 'L' FLOWING INTO 'F' MONOGRAM -->
  <!-- Continuous Fluid Ribbon: Down L -> Base L -> Climbs to F Stem -> Turns to Top F Bar -->
  <path d="M 16 14 
           L 16 35 
           C 16 40.5, 21 41, 24.5 41 
           C 28 41, 30.5 39, 30.5 35 
           L 30.5 18 
           C 30.5 14, 33 14, 37 14 
           L 41.5 14" 
        stroke="url(#lf_ribbon_grad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#lf_ribbon_shadow)" />

  <!-- F Mid Crossbar: Dynamic Speech Wing in Coral/Rose -->
  <path d="M 30.5 27.5 L 39.5 27.5" 
        stroke="url(#lf_crossbar_grad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        filter="url(#lf_ribbon_shadow)" />

  <!-- Golden Magic Sparkle -->
  <path d="M 43 7 L 44 4 L 45 7 L 48 8 L 45 9 L 44 12 L 43 9 L 40 8 Z" 
        fill="#FDE047" 
        filter="drop-shadow(0 0 4px rgba(253, 224, 71, 0.8))" />
</svg>
