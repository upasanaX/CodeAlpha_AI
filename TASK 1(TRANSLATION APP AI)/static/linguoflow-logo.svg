<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64" fill="none">
  <defs>
    <!-- Background Glassmorphic Jewel -->
    <linearGradient id="lf_logo_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1238" />
      <stop offset="50%" stop-color="#140C28" />
      <stop offset="100%" stop-color="#0A0618" />
    </linearGradient>

    <!-- Iridescent Border -->
    <linearGradient id="lf_logo_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.9" />
    </linearGradient>

    <!-- Continuous L-to-F Flow Ribbon Gradient -->
    <linearGradient id="lf_logo_ribbon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="30%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- F Crossbar Accent Gradient -->
    <linearGradient id="lf_logo_crossbar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>

    <!-- Text Flow Gradient -->
    <linearGradient id="lf_logo_text_flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Pro Badge Gradient -->
    <linearGradient id="lf_logo_pro_badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- 3D Shadow for the Ribbon -->
    <filter id="lf_logo_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#818CF8" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- LF CREATIVE MONOGRAM TILE -->
  <g transform="translate(4, 4)">
    <!-- Tile Backdrop -->
    <rect x="0" y="0" width="56" height="56" rx="16" 
          fill="url(#lf_logo_bg)" 
          stroke="url(#lf_logo_border)" 
          stroke-width="1.8" />

    <!-- Ambient Internal Light -->
    <circle cx="20" cy="20" r="14" fill="#7C3AED" opacity="0.25" />
    <circle cx="38" cy="36" r="14" fill="#0284C7" opacity="0.2" />

    <!-- Continuous L-to-F Ribbon -->
    <path d="M 16 14 
             L 16 35 
             C 16 40.5, 21 41, 24.5 41 
             C 28 41, 30.5 39, 30.5 35 
             L 30.5 18 
             C 30.5 14, 33 14, 37 14 
             L 41.5 14" 
          stroke="url(#lf_logo_ribbon)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#lf_logo_glow)" />

    <!-- F Crossbar in Vibrant Rose -->
    <path d="M 30.5 27.5 L 39.5 27.5" 
          stroke="url(#lf_logo_crossbar)" 
          stroke-width="5" 
          stroke-linecap="round" 
          filter="url(#lf_logo_glow)" />

    <!-- Sparkle Star -->
    <path d="M 43 7 L 44 4 L 45 7 L 48 8 L 45 9 L 44 12 L 43 9 L 40 8 Z" 
          fill="#FDE047" 
          filter="drop-shadow(0 0 4px rgba(253, 224, 71, 0.8))" />
  </g>

  <!-- TYPOGRAPHY LOCKUP -->
  <g transform="translate(74, 39)">
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="28" 
          font-weight="900" 
          letter-spacing="-0.8px" 
          fill="#FFFFFF">Linguo</text>

    <text x="96" y="0" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="28" 
          font-weight="900" 
          letter-spacing="-0.8px" 
          fill="url(#lf_logo_text_flow)">Flow</text>

    <!-- PRO Pill -->
    <rect x="166" y="-22" width="40" height="20" rx="6" fill="url(#lf_logo_pro_badge)" />
    <text x="186" y="-8" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" 
          font-size="10" 
          font-weight="800" 
          letter-spacing="0.6px" 
          fill="#FFFFFF" 
          text-anchor="middle">PRO</text>
  </g>

  <!-- Tagline -->
  <text x="74" y="54" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="10" 
        font-weight="600" 
        letter-spacing="1.2px" 
        fill="#94A3B8">SEAMLESS AI TRANSLATION ✨</text>
</svg>
